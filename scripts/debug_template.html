<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Debug: сжатие + детекция тонких мест</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#1e1e1e; color:#ddd; }
  #panel { position:fixed; top:8px; left:8px; background:#2a2a2a; padding:10px 12px;
           border-radius:8px; font-size:13px; z-index:10; width:280px; }
  #panel label { display:block; margin:6px 0 2px; }
  #panel input[type=range] { width:100%; }
  #panel .val { color:#f90; }
  #hint { color:#888; font-size:11px; margin-top:8px; }
  svg { display:block; background:#15151a; }
</style>
</head>
<body>
<div id="panel">
  <b>Debug-слой</b>
  <label><input type="checkbox" id="cbDetect" checked> Детекция тонких мест</label>
  <label>r0 (чувствительность): <span class="val" id="vR0">6</span></label>
  <input type="range" id="sR0" min="2" max="20" step="1" value="6">
  <label><input type="checkbox" id="cbShrink" checked> Превью сжатия</label>
  <label>r (сжатие): <span class="val" id="vR">4</span></label>
  <input type="range" id="sR" min="0" max="15" step="0.5" value="4">
  <label>плавность: <span class="val" id="vT">0.8</span></label>
  <input type="range" id="sT" min="0" max="1" step="0.05" value="0.8">
  <label><input type="checkbox" id="cbMarker" checked> Маркер 3 (референс)</label>
  <label><input type="checkbox" id="cbBase" checked> Районы (исходно)</label>
  <div id="hint">Красное = тонкие места (сосиски/выступы). Оранжевое = сжатая гладкая кривая. Мажента = твой маркер.</div>
</div>
<svg id="view" xmlns="http://www.w3.org/2000/svg"></svg>

<script>var module = (typeof module !== "undefined") ? module : { exports: {} };</script>
<script>__CLIPPER__</script>
<script>
const CL = window.ClipperLib;
const DATA = __DATA__;

// ---------- геометрия (копия spline_core, браузер) ----------
function dist2seg(p,a,b){const vx=b[0]-a[0],vy=b[1]-a[1],wx=p[0]-a[0],wy=p[1]-a[1];
  const c1=vx*wx+vy*wy,c2=vx*vx+vy*vy,t=c2===0?0:Math.max(0,Math.min(1,c1/c2));
  const dx=p[0]-(a[0]+t*vx),dy=p[1]-(a[1]+t*vy);return Math.hypot(dx,dy);}
function resampleRing(ring,spacing){if(!ring||ring.length<2)return ring?ring.slice():[];
  let pts=ring.slice();if(pts.length>1&&pts[0][0]===pts[pts.length-1][0]&&pts[0][1]===pts[pts.length-1][1])pts.pop();
  const n=pts.length;if(n<2)return pts;const cum=[0];let total=0;
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];total+=Math.hypot(b[0]-a[0],b[1]-a[1]);cum.push(total);}
  if(total===0)return pts;const out=[];
  for(let d=0;d<total;d+=spacing){let lo=0,hi=n;while(lo<hi){const mid=(lo+hi)>>1;if(cum[mid]<=d)lo=mid+1;else hi=mid;}
    const k=Math.max(1,lo)-1;const p0=pts[k],p1=pts[(k+1)%n];const segL=(cum[k+1]-cum[k])||1;const t=(d-cum[k])/segL;
    out.push([p0[0]+(p1[0]-p0[0])*t,p0[1]+(p1[1]-p0[1])*t]);}
  return out;}
function catmullSpline(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;
  return [0.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
          0.5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)];}
function catmullRomRing(ring,tension,step){if(!ring||ring.length<3)return ring||[];
  tension=tension==null?0.6:tension;step=step==null?2:step;if(tension<=0)return ring.slice();
  let pts=resampleRing(ring,step);pts=simplifyPts(pts,step*0.75);const n=pts.length;if(n<4)return pts;const out=[];
  for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    let len=0,prev=p1;for(let k=1;k<=4;k++){const q=catmullSpline(p0,p1,p2,p3,k/4);
      len+=Math.hypot(q[0]-prev[0],q[1]-prev[1]);prev=q;}
    const count=Math.max(1,Math.round(len/step));
    for(let j=0;j<count;j++){const t=j/count;const sp=catmullSpline(p0,p1,p2,p3,t);
      const chx=p1[0]+(p2[0]-p1[0])*t,chy=p1[1]+(p2[1]-p1[1])*t;
      out.push([chx+(sp[0]-chx)*tension,chy+(sp[1]-chy)*tension]);}}
  return out;}
function simplifyPts(pts,eps){if(pts.length<3)return pts;function rec(s,e){let maxd=0,idx=0;
  for(let i=s+1;i<e;i++){const d=dist2seg(pts[i],pts[s],pts[e]);if(d>maxd){maxd=d;idx=i;}}
  if(maxd>eps){return rec(s,idx).slice(0,-1).concat(rec(idx,e));}return[pts[s],pts[e]];}
  return rec(0,pts.length-1);}
function shrinkRing(ring,r,opts){opts=opts||{};const scale=100;
  const path=ring.map(p=>({X:Math.round(p[0]*scale),Y:Math.round(p[1]*scale)}));
  const co=new CL.ClipperOffset();co.ArcTolerance=0.25*scale;
  co.AddPath(path,CL.JoinType.jtRound,CL.EndType.etClosedPolygon);
  const sol=[];co.Execute(sol,-Math.round(r*scale));if(!sol.length)return [];
  let best=sol[0];for(const p of sol)if(p.length>best.length)best=p;
  let out=best.map(pt=>[pt.X/scale,pt.Y/scale]);
  if(opts.finalSmooth){const ten=opts.finalSmooth===true?0.6:opts.finalSmooth;out=catmullRomRing(out,ten,2);}
  return out;}
function plMinRing(p,ring){let best=Infinity;for(let i=0;i+1<ring.length;i++){const d=dist2seg(p,ring[i],ring[i+1]);if(d<best)best=d;}return best;}
function detectThin(ring,r0,opts){r0=r0==null?3:r0;const spacing=(opts&&opts.spacing)||3;
  const dense=ring.length<120?resampleRing(ring,spacing):ring;
  const shrunk=shrinkRing(dense,r0,{});if(!shrunk.length)return dense.map(()=>false);
  const out=[];for(let i=0;i<dense.length;i++)out.push(plMinRing(dense[i],shrunk)>r0*1.5);return out}

// ---------- рендер ----------
const svg=document.getElementById('view');
function fmt(pts){if(!pts||pts.length<2)return '';return 'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')+' Z';}
function fmtC(pts){if(!pts||pts.length<3)return fmt(pts);const n=pts.length;
  let d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);}
  return d+' Z';}
function bbox(){let a=[1e9,1e9,-1e9,-1e9];
  for(const d of DATA.districts)for(const p of d.pts){a[0]=Math.min(a[0],p[0]);a[1]=Math.min(a[1],p[1]);a[2]=Math.max(a[2],p[0]);a[3]=Math.max(a[3],p[1]);}
  if(DATA.volga)for(const vl of DATA.volga)for(const p of vl){a[0]=Math.min(a[0],p[0]);a[1]=Math.min(a[1],p[1]);a[2]=Math.max(a[2],p[0]);a[3]=Math.max(a[3],p[1]);}
  return a;}
const bb=bbox();
svg.setAttribute('viewBox',`${bb[0]-30} ${bb[1]-30} ${bb[2]-bb[0]+60} ${bb[3]-bb[1]+60}`);
svg.setAttribute('width','100%');svg.setAttribute('height','100vh');

function render(){
  const r0=+document.getElementById('sR0').value;
  const r=+document.getElementById('sR').value;
  const ten=+document.getElementById('sT').value;
  const showDetect=document.getElementById('cbDetect').checked;
  const showShrink=document.getElementById('cbShrink').checked;
  const showMarker=document.getElementById('cbMarker').checked;
  const showBase=document.getElementById('cbBase').checked;
  document.getElementById('vR0').textContent=r0;
  document.getElementById('vR').textContent=r;
  document.getElementById('vT').textContent=ten;
  let s='';
  if(showBase){
    for(const d of DATA.districts) s+=`<path d="${fmt(d.pts)}" fill="#4a5163" stroke="#9aa3b2" stroke-width="0.8"/>`;
    if(DATA.volga) for(const vl of DATA.volga) s+=`<path d="${fmt(vl)}" fill="#1d3a5a" stroke="#39f" stroke-width="1"/>`;
  }
  if(showDetect){
    for(const d of DATA.districts){
      const ring=resampleRing(d.pts,3);const thin=detectThin(d.pts,r0);
      for(let i=0;i<ring.length;i++){if(thin[i]){const a=ring[i],b=ring[(i+1)%ring.length];
        s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#f33" stroke-width="2.4"/>`;}}
    }
  }
  if(showShrink){
    for(const d of DATA.districts){const sh=shrinkRing(d.pts,r,{finalSmooth:ten});
      if(sh.length) s+=`<path d="${fmtC(sh)}" fill="none" stroke="#f90" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>`;}
  }
  if(showMarker && DATA.marker){
    s+=`<path d="${fmt(DATA.marker)}" fill="none" stroke="#f0f" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  svg.innerHTML=s;
}
['sR0','sR','sT','cbDetect','cbShrink','cbMarker','cbBase'].forEach(id=>
  document.getElementById(id).addEventListener('input',render));
render();
</script>
</body>
</html>
