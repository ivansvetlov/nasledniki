  //to LocalMinima list to avoid endless loops etc ...
  if (IsFlat)
  {
    if (Closed)
      return false;
    E.Prev.OutIdx = ClipperLib.ClipperBase.Skip;
    if (E.Prev.Bot.X < E.Prev.Top.X)
      this.ReverseHorizontal(E.Prev);
    var locMin = new ClipperLib.LocalMinima();
    locMin.Next = null;
    locMin.Y = E.Bot.Y;
    locMin.LeftBound = null;
    locMin.RightBound = E;
    locMin.RightBound.Side = ClipperLib.EdgeSide.esRight;
    locMin.RightBound.WindDelta = 0;
    while (E.Next.OutIdx != ClipperLib.ClipperBase.Skip)
    {
      E.NextInLML = E.Next;
      if (E.Bot.X != E.Prev.Top.X)
        this.ReverseHorizontal(E);
      E = E.Next;
    }
    this.InsertLocalMinima(locMin);
    this.m_edges.push(edges);
    return true;
  }
  this.m_edges.push(edges);
  var clockwise;
  var EMin = null;
  for (;;)
  {
    E = this.FindNextLocMin(E);
    if (E == EMin)
      break;
    else if (EMin == null)
      EMin = E;
    //E and E.Prev now share a local minima (left aligned if horizontal).
    //Compare their slopes to find which starts which bound ...
    var locMin = new ClipperLib.LocalMinima();
    locMin.Next = null;
    locMin.Y = E.Bot.Y;
    if (E.Dx < E.Prev.Dx)
    {
      locMin.LeftBound = E.Prev;
      locMin.RightBound = E;
      clockwise = false;
      //Q.nextInLML = Q.prev
    }
    else
    {
      locMin.LeftBound = E;
      locMin.RightBound = E.Prev;
      clockwise = true;
      //Q.nextInLML = Q.next
    }
    locMin.LeftBound.Side = ClipperLib.EdgeSide.esLeft;
    locMin.RightBound.Side = ClipperLib.EdgeSide.esRight;
    if (!Closed)
      locMin.LeftBound.WindDelta = 0;
    else if (locMin.LeftBound.Next == locMin.RightBound)
      locMin.LeftBound.WindDelta = -1;
    else
      locMin.LeftBound.WindDelta = 1;
    locMin.RightBound.WindDelta = -locMin.LeftBound.WindDelta;
    E = this.ProcessBound(locMin.LeftBound, clockwise);
    var E2 = this.ProcessBound(locMin.RightBound, !clockwise);
    if (locMin.LeftBound.OutIdx == ClipperLib.ClipperBase.Skip)
      locMin.LeftBound = null;
    else if (locMin.RightBound.OutIdx == ClipperLib.ClipperBase.Skip)
      locMin.RightBound = null;
    this.InsertLocalMinima(locMin);
    if (!clockwise)
      E = E2;
  }
  return true;
};
ClipperLib.ClipperBase.prototype.AddPaths = function (ppg, polyType, closed)
{

  //  console.log(JSON.stringify(ppg));
  var result = false;
  for (var i = 0, ilen = ppg.length; i < ilen; ++i)
    if (this.AddPath(ppg[i], polyType, closed))
      result = true;
  return result;
};

ClipperLib.ClipperBase.prototype.Pt2IsBetweenPt1AndPt3 = function (pt1, pt2, pt3)
{
  if ((ClipperLib.IntPoint.op_Equality(pt1, pt3)) || (ClipperLib.IntPoint.op_Equality(pt1, pt2)) ||
    (ClipperLib.IntPoint.op_Equality(pt3, pt2)))
    return false;
  else if (pt1.X != pt3.X)
    return (pt2.X > pt1.X) == (pt2.X < pt3.X);
  else
    return (pt2.Y > pt1.Y) == (pt2.Y < pt3.Y);
};
ClipperLib.ClipperBase.prototype.RemoveEdge = function (e)
{
  //removes e from double_linked_list (but without removing from memory)

  e.Next.Prev = e.Prev;
  var result = e.Next;
  e.Prev = null; //flag as removed (see ClipperBase.Clear)
  return result;
};
ClipperLib.ClipperBase.prototype.SetDx = function (e)
{
  e.Delta.X = (e.Top.X - e.Bot.X);
  e.Delta.Y = (e.Top.Y - e.Bot.Y);
  if (e.Delta.Y === 0) e.Dx = ClipperLib.ClipperBase.horizontal;
  else e.Dx = (e.Delta.X) / (e.Delta.Y);
};
ClipperLib.ClipperBase.prototype.InsertLocalMinima = function (newLm)
{
  if (this.m_MinimaList === null)
  {
    this.m_MinimaList = newLm;
  }
  else if (newLm.Y >= this.m_MinimaList.Y)
  {
    newLm.Next = this.m_MinimaList;
    this.m_MinimaList = newLm;
  }
  else
  {
    var tmpLm = this.m_MinimaList;
    while (tmpLm.Next !== null && (newLm.Y < tmpLm.Next.Y))
      tmpLm = tmpLm.Next;
    newLm.Next = tmpLm.Next;
    tmpLm.Next = newLm;
  }
};
ClipperLib.ClipperBase.prototype.PopLocalMinima = function ()
{
  if (this.m_CurrentLM === null)
    return;
  this.m_CurrentLM = this.m_CurrentLM.Next;
};
ClipperLib.ClipperBase.prototype.ReverseHorizontal = function (e)
{
  //swap horizontal edges' top and bottom x's so they follow the natural
  //progression of the bounds - ie so their xbots will align with the
  //adjoining lower edge. [Helpful in the ProcessHorizontal() method.]
  var tmp = e.Top.X;
  e.Top.X = e.Bot.X;
  e.Bot.X = tmp;

    e.Top.Z = e.Bot.Z;
    e.Bot.Z = tmp;
  }
};
ClipperLib.ClipperBase.prototype.Reset = function ()
{
  this.m_CurrentLM = this.m_MinimaList;
  if (this.m_CurrentLM == null)
    return;

  //reset all edges ...
  var lm = this.m_MinimaList;
  while (lm != null)
  {
    var e = lm.LeftBound;
    if (e != null)
    {
      //e.Curr = e.Bot;
      e.Curr.X = e.Bot.X;
      e.Curr.Y = e.Bot.Y;
      e.Side = ClipperLib.EdgeSide.esLeft;
      e.OutIdx = ClipperLib.ClipperBase.Unassigned;
    }
    e = lm.RightBound;
    if (e != null)
    {
      //e.Curr = e.Bot;
      e.Curr.X = e.Bot.X;
      e.Curr.Y = e.Bot.Y;
      e.Side = ClipperLib.EdgeSide.esRight;
      e.OutIdx = ClipperLib.ClipperBase.Unassigned;
    }
    lm = lm.Next;
  }

ClipperLib.Clipper.prototype.InsertScanbeam = function (Y)

  }

  {

    newSb.Next = this.m_Scanbeam;
    this.m_Scanbeam = newSb;
  }
  else
  {

      return;
    //ie ignores duplicates

ClipperLib.Clipper.prototype.Execute = function ()
{
  var a = arguments,
    alen = a.length,
    ispolytree = a[1] instanceof ClipperLib.PolyTree;
  if (alen == 4 && !ispolytree) // function (clipType, solution, subjFillType, clipFillType)
  {
    var clipType = a[0],
      solution = a[1],
      subjFillType = a[2],
      clipFillType = a[3];
    if (this.m_ExecuteLocked)
      return false;
    if (this.m_HasOpenPaths)
      ClipperLib.Error("Error: PolyTree struct is need for open path clipping.");
    this.m_ExecuteLocked = true;
    ClipperLib.Clear(solution);
    this.m_SubjFillType = subjFillType;
    this.m_ClipFillType = clipFillType;
    this.m_ClipType = clipType;
    this.m_UsingPolyTree = false;
    try
    {
      var succeeded = this.ExecuteInternal();
      //build the return polygons ...
      if (succeeded) this.BuildResult(solution);
    }
    finally
    {
      this.DisposeAllPolyPts();
      this.m_ExecuteLocked = false;
    }
    return succeeded;
  }
  else if (alen == 4 && ispolytree) // function (clipType, polytree, subjFillType, clipFillType)
  {
    var clipType = a[0],
      polytree = a[1],
      subjFillType = a[2],
      clipFillType = a[3];
    if (this.m_ExecuteLocked)
      return false;
    this.m_ExecuteLocked = true;
    this.m_SubjFillType = subjFillType;
    this.m_ClipFillType = clipFillType;
    this.m_ClipType = clipType;
    this.m_UsingPolyTree = true;
    try
    {
      var succeeded = this.ExecuteInternal();
      //build the return polygons ...
      if (succeeded) this.BuildResult2(polytree);
    }
    finally
    {
      this.DisposeAllPolyPts();
      this.m_ExecuteLocked = false;
    }
    return succeeded;
  }
  else if (alen == 2 && !ispolytree) // function (clipType, solution)
  {
    var clipType = a[0],
      solution = a[1];
    return this.Execute(clipType, solution, ClipperLib.PolyFillType.pftEvenOdd, ClipperLib.PolyFillType.pftEvenOdd);
  }
  else if (alen == 2 && ispolytree) // function (clipType, polytree)
  {
    var clipType = a[0],
      polytree = a[1];
    return this.Execute(clipType, polytree, ClipperLib.PolyFillType.pftEvenOdd, ClipperLib.PolyFillType.pftEvenOdd);

ClipperLib.Clipper.prototype.FixHoleLinkage = function (outRec)

ClipperLib.Clipper.prototype.ExecuteInternal = function ()
{

    do {
      this.InsertLocalMinimaIntoAEL(botY);
      ClipperLib.Clear(this.m_GhostJoins);
      this.ProcessHorizontals(false);
      if (this.m_Scanbeam === null)
        break;
      var topY = this.PopScanbeam();
      //console.log("botY:" + botY + ", topY:" + topY);
      if (!this.ProcessIntersections(botY, topY))
        return false;
      this.ProcessEdgesAtTopOfScanbeam(topY);
      botY = topY;
    }
    while (this.m_Scanbeam !== null || this.m_CurrentLM !== null)

    {

        continue;
      if ((outRec.IsHole ^ this.ReverseSolution) == (this.Area(outRec) > 0))
        this.ReversePolyPtLinks(outRec.Pts);
    }
    this.JoinCommonEdges();
    for (var i = 0, ilen = this.m_PolyOuts.length; i < ilen; i++)
    {

      if (outRec.Pts !== null && !outRec.IsOpen)
        this.FixupOutPolygon(outRec);
    }

      this.DoSimplePolygons();

  }

        rb.WindDelta !== 0 && rb.PrevInAEL.WindDelta !== 0)

        this.AddJoin(Op1, Op2, rb.Top);

ClipperLib.Clipper.prototype.InsertEdgeIntoAEL = function (edge, startEdge)

  {
    edge.PrevInAEL = null;
    edge.NextInAEL = this.m_ActiveEdges;
    this.m_ActiveEdges.PrevInAEL = edge;
    this.m_ActiveEdges = edge;
  }
  else
  {
    if (startEdge === null)
      startEdge = this.m_ActiveEdges;
    while (startEdge.NextInAEL !== null && !this.E2InsertsBeforeE1(startEdge.NextInAEL, edge))
      startEdge = startEdge.NextInAEL;
    edge.NextInAEL = startEdge.NextInAEL;
    if (startEdge.NextInAEL !== null)

ClipperLib.Clipper.prototype.E2InsertsBeforeE1 = function (e1, e2)
{

      return e2.Top.X < ClipperLib.Clipper.TopX(e1, e2.Top.Y);
    else
      return e1.Top.X > ClipperLib.Clipper.TopX(e2, e1.Top.Y);

ClipperLib.Clipper.prototype.IsEvenOddFillType = function (edge)
{

    return this.m_SubjFillType == ClipperLib.PolyFillType.pftEvenOdd;
  else
    return this.m_ClipFillType == ClipperLib.PolyFillType.pftEvenOdd;
};
ClipperLib.Clipper.prototype.IsEvenOddAltFillType = function (edge)
{
  if (edge.PolyTyp == ClipperLib.PolyType.ptSubject)
    return this.m_ClipFillType == ClipperLib.PolyFillType.pftEvenOdd;
  else
    return this.m_SubjFillType == ClipperLib.PolyFillType.pftEvenOdd;

ClipperLib.Clipper.prototype.IsContributing = function (edge)

  {

    pft2 = this.m_ClipFillType;
  }
  else
  {
    pft = this.m_ClipFillType;
    pft2 = this.m_SubjFillType;
  }
  switch (pft)
  {
  case ClipperLib.PolyFillType.pftEvenOdd:
    if (edge.WindDelta === 0 && edge.WindCnt != 1)
      return false;
    break;
  case ClipperLib.PolyFillType.pftNonZero:
    if (Math.abs(edge.WindCnt) != 1)
      return false;
    break;
  case ClipperLib.PolyFillType.pftPositive:
    if (edge.WindCnt != 1)
      return false;
    break;

    if (edge.WindCnt != -1)
      return false;
    break;
  }

  {
  case ClipperLib.ClipType.ctIntersection:
    switch (pft2)
    {
    case ClipperLib.PolyFillType.pftEvenOdd:

      return (edge.WindCnt2 !== 0);
    case ClipperLib.PolyFillType.pftPositive:
      return (edge.WindCnt2 > 0);
    default:
      return (edge.WindCnt2 < 0);
    }
  case ClipperLib.ClipType.ctUnion:
    switch (pft2)
    {
    case ClipperLib.PolyFillType.pftEvenOdd:
    case ClipperLib.PolyFillType.pftNonZero:
      return (edge.WindCnt2 === 0);
    case ClipperLib.PolyFillType.pftPositive:
      return (edge.WindCnt2 <= 0);
    default:
      return (edge.WindCnt2 >= 0);
    }
  case ClipperLib.ClipType.ctDifference:
    if (edge.PolyTyp == ClipperLib.PolyType.ptSubject)
      switch (pft2)
      {
      case ClipperLib.PolyFillType.pftEvenOdd:
      case ClipperLib.PolyFillType.pftNonZero:
        return (edge.WindCnt2 === 0);
      case ClipperLib.PolyFillType.pftPositive:
        return (edge.WindCnt2 <= 0);
      default:
        return (edge.WindCnt2 >= 0);
      }
    else
      switch (pft2)
      {
      case ClipperLib.PolyFillType.pftEvenOdd:
      case ClipperLib.PolyFillType.pftNonZero:
        return (edge.WindCnt2 !== 0);
      case ClipperLib.PolyFillType.pftPositive:
        return (edge.WindCnt2 > 0);
      default:
        return (edge.WindCnt2 < 0);
      }
  case ClipperLib.ClipType.ctXor:
    if (edge.WindDelta === 0)
      switch (pft2)
      {
      case ClipperLib.PolyFillType.pftEvenOdd:
      case ClipperLib.PolyFillType.pftNonZero:
        return (edge.WindCnt2 === 0);
      case ClipperLib.PolyFillType.pftPositive:
        return (edge.WindCnt2 <= 0);
      default:
        return (edge.WindCnt2 >= 0);
      }

};
ClipperLib.Clipper.prototype.SetWindingCount = function (edge)
{
  var e = edge.PrevInAEL;
  //find the edge of the same polytype that immediately preceeds 'edge' in AEL
  while (e !== null && ((e.PolyTyp != edge.PolyTyp) || (e.WindDelta === 0)))
    e = e.PrevInAEL;
  if (e === null)
  {
    edge.WindCnt = (edge.WindDelta === 0 ? 1 : edge.WindDelta);
    edge.WindCnt2 = 0;
    e = this.m_ActiveEdges;
    //ie get ready to calc WindCnt2
  }
  else if (edge.WindDelta === 0 && this.m_ClipType != ClipperLib.ClipType.ctUnion)
  {
    edge.WindCnt = 1;
    edge.WindCnt2 = e.WindCnt2;
    e = e.NextInAEL;
    //ie get ready to calc WindCnt2
  }
  else if (this.IsEvenOddFillType(edge))
  {
    //EvenOdd filling ...
    if (edge.WindDelta === 0)
    {
      //are we inside a subj polygon ...
      var Inside = true;
      var e2 = e.PrevInAEL;
      while (e2 !== null)
      {
        if (e2.PolyTyp == e.PolyTyp && e2.WindDelta !== 0)
          Inside = !Inside;
        e2 = e2.PrevInAEL;
      }
      edge.WindCnt = (Inside ? 0 : 1);
    }
    else
    {
      edge.WindCnt = edge.WindDelta;
    }
    edge.WindCnt2 = e.WindCnt2;
    e = e.NextInAEL;
    //ie get ready to calc WindCnt2
  }
  else
  {
    //nonZero, Positive or Negative filling ...
    if (e.WindCnt * e.WindDelta < 0)
    {
      //prev edge is 'decreasing' WindCount (WC) toward zero
      //so we're outside the previous polygon ...
      if (Math.abs(e.WindCnt) > 1)
      {
        //outside prev poly but still inside another.
        //when reversing direction of prev poly use the same WC 
        if (e.WindDelta * edge.WindDelta < 0)
          edge.WindCnt = e.WindCnt;
        else
          edge.WindCnt = e.WindCnt + edge.WindDelta;
      }
      else
        edge.WindCnt = (edge.WindDelta === 0 ? 1 : edge.WindDelta);
    }
    else
    {
      //prev edge is 'increasing' WindCount (WC) away from zero
      //so we're inside the previous polygon ...
      if (edge.WindDelta === 0)
        edge.WindCnt = (e.WindCnt < 0 ? e.WindCnt - 1 : e.WindCnt + 1);
      else if (e.WindDelta * edge.WindDelta < 0)
        edge.WindCnt = e.WindCnt;
      else
        edge.WindCnt = e.WindCnt + edge.WindDelta;
    }
    edge.WindCnt2 = e.WindCnt2;
    e = e.NextInAEL;
    //ie get ready to calc WindCnt2
  }
  //update WindCnt2 ...
  if (this.IsEvenOddAltFillType(edge))
  {
    //EvenOdd filling ...
    while (e != edge)
    {
      if (e.WindDelta !== 0)
        edge.WindCnt2 = (edge.WindCnt2 === 0 ? 1 : 0);
      e = e.NextInAEL;
    }
  }
  else
  {
    //nonZero, Positive or Negative filling ...
    while (e != edge)
    {
      edge.WindCnt2 += e.WindDelta;
      e = e.NextInAEL;
    }
  }
};
ClipperLib.Clipper.prototype.AddEdgeToSEL = function (edge)
{

  if (this.m_SortedEdges === null)
  {
    this.m_SortedEdges = edge;
    edge.PrevInSEL = null;
    edge.NextInSEL = null;
  }
  else
  {
    edge.NextInSEL = this.m_SortedEdges;
    edge.PrevInSEL = null;
    this.m_SortedEdges.PrevInSEL = edge;
    this.m_SortedEdges = edge;
  }

ClipperLib.Clipper.prototype.CopyAELToSEL = function ()
{
  var e = this.m_ActiveEdges;

    e.NextInSEL = e.NextInAEL;

  }

ClipperLib.Clipper.prototype.SwapPositionsInAEL = function (edge1, edge2)
{
  //check that one or other edge hasn't already been removed from AEL ...

    return;

      next.PrevInAEL = edge1;
    var prev = edge1.PrevInAEL;
    if (prev !== null)
      prev.NextInAEL = edge2;
    edge2.PrevInAEL = prev;
    edge2.NextInAEL = edge1;
    edge1.PrevInAEL = edge2;
    edge1.NextInAEL = next;
  }
  else if (edge2.NextInAEL == edge1)
  {
    var next = edge1.NextInAEL;
    if (next !== null)
      next.PrevInAEL = edge2;
    var prev = edge2.PrevInAEL;
    if (prev !== null)
      prev.NextInAEL = edge1;
    edge1.PrevInAEL = prev;
    edge1.NextInAEL = edge2;
    edge2.PrevInAEL = edge1;
    edge2.NextInAEL = next;
  }
  else
  {
    var next = edge1.NextInAEL;
    var prev = edge1.PrevInAEL;
    edge1.NextInAEL = edge2.NextInAEL;
    if (edge1.NextInAEL !== null)
      edge1.NextInAEL.PrevInAEL = edge1;
    edge1.PrevInAEL = edge2.PrevInAEL;
    if (edge1.PrevInAEL !== null)
      edge1.PrevInAEL.NextInAEL = edge1;
    edge2.NextInAEL = next;
    if (edge2.NextInAEL !== null)
      edge2.NextInAEL.PrevInAEL = edge2;
    edge2.PrevInAEL = prev;
    if (edge2.PrevInAEL !== null)
      edge2.PrevInAEL.NextInAEL = edge2;

};
ClipperLib.Clipper.prototype.SwapPositionsInSEL = function (edge1, edge2)
{
  if (edge1.NextInSEL === null && edge1.PrevInSEL === null)
    return;
  if (edge2.NextInSEL === null && edge2.PrevInSEL === null)
    return;
  if (edge1.NextInSEL == edge2)
  {
    var next = edge2.NextInSEL;
    if (next !== null)
      next.PrevInSEL = edge1;
    var prev = edge1.PrevInSEL;
    if (prev !== null)
      prev.NextInSEL = edge2;
    edge2.PrevInSEL = prev;
    edge2.NextInSEL = edge1;
    edge1.PrevInSEL = edge2;
    edge1.NextInSEL = next;
  }
  else if (edge2.NextInSEL == edge1)
  {
    var next = edge1.NextInSEL;
    if (next !== null)
      next.PrevInSEL = edge2;
    var prev = edge2.PrevInSEL;
    if (prev !== null)
      prev.NextInSEL = edge1;
    edge1.PrevInSEL = prev;
    edge1.NextInSEL = edge2;
    edge2.PrevInSEL = edge1;
    edge2.NextInSEL = next;
  }
  else
  {
    var next = edge1.NextInSEL;
    var prev = edge1.PrevInSEL;
    edge1.NextInSEL = edge2.NextInSEL;
    if (edge1.NextInSEL !== null)
      edge1.NextInSEL.PrevInSEL = edge1;
    edge1.PrevInSEL = edge2.PrevInSEL;
    if (edge1.PrevInSEL !== null)
      edge1.PrevInSEL.NextInSEL = edge1;
    edge2.NextInSEL = next;
    if (edge2.NextInSEL !== null)
      edge2.NextInSEL.PrevInSEL = edge2;
    edge2.PrevInSEL = prev;
    if (edge2.PrevInSEL !== null)
      edge2.PrevInSEL.NextInSEL = edge2;
  }
  if (edge1.PrevInSEL === null)
    this.m_SortedEdges = edge1;
  else if (edge2.PrevInSEL === null)
    this.m_SortedEdges = edge2;

ClipperLib.Clipper.prototype.AddLocalMaxPoly = function (e1, e2, pt)

  this.AddOutPt(e1, pt);

  if (e1.OutIdx == e2.OutIdx)
  {
    e1.OutIdx = -1;
    e2.OutIdx = -1;
  }
  else if (e1.OutIdx < e2.OutIdx)
    this.AppendPolygon(e1, e2);
  else
    this.AppendPolygon(e2, e1);

ClipperLib.Clipper.prototype.AddLocalMinPoly = function (e1, e2, pt)

    e1.Side = ClipperLib.EdgeSide.esLeft;
    e2.Side = ClipperLib.EdgeSide.esRight;

      prevE = e2.PrevInAEL;
    else
      prevE = e.PrevInAEL;
  }

  {
    result = this.AddOutPt(e2, pt);
    e1.OutIdx = e2.OutIdx;
    e1.Side = ClipperLib.EdgeSide.esRight;
    e2.Side = ClipperLib.EdgeSide.esLeft;
    e = e2;

    else
      prevE = e.PrevInAEL;

ClipperLib.Clipper.prototype.CreateOutRec = function ()
{
  var result = new ClipperLib.OutRec();
  result.Idx = -1;
  result.IsHole = false;
  result.IsOpen = false;
  result.FirstLeft = null;
  result.Pts = null;
  result.BottomPt = null;
  result.PolyNode = null;
  this.m_PolyOuts.push(result);
  result.Idx = this.m_PolyOuts.length - 1;
  return result;
};
ClipperLib.Clipper.prototype.AddOutPt = function (e, pt)

  {

    outRec.IsOpen = (e.WindDelta === 0);
    var newOp = new ClipperLib.OutPt();
    outRec.Pts = newOp;
    newOp.Idx = outRec.Idx;
    //newOp.Pt = pt;
    newOp.Pt.X = pt.X;
    newOp.Pt.Y = pt.Y;
    newOp.Next = newOp;
    newOp.Prev = newOp;
    if (!outRec.IsOpen)
      this.SetHoleState(e, outRec);
    if (use_xyz)
    {
      if (ClipperLib.IntPoint.op_Equality(pt, e.Bot))
      {
        //newOp.Pt = e.Bot;
        newOp.Pt.X = e.Bot.X;
        newOp.Pt.Y = e.Bot.Y;
        newOp.Pt.Z = e.Bot.Z;
      }
      else if (ClipperLib.IntPoint.op_Equality(pt, e.Top))
      {
        //newOp.Pt = e.Top;
        newOp.Pt.X = e.Top.X;
        newOp.Pt.Y = e.Top.Y;
        newOp.Pt.Z = e.Top.Z;
      }

    else if (!ToFront && ClipperLib.IntPoint.op_Equality(pt, op.Prev.Pt))

    newOp.Idx = outRec.Idx;
    //newOp.Pt = pt;
    newOp.Pt.X = pt.X;
    newOp.Pt.Y = pt.Y;
    newOp.Next = op;
    newOp.Prev = op.Prev;
    newOp.Prev.Next = newOp;
    op.Prev = newOp;
    if (ToFront)

    if (use_xyz)
    {
      if (ClipperLib.IntPoint.op_Equality(pt, e.Bot))
      {

        newOp.Pt.X = e.Bot.X;
        newOp.Pt.Y = e.Bot.Y;
        newOp.Pt.Z = e.Bot.Z;
      }
      else if (ClipperLib.IntPoint.op_Equality(pt, e.Top))
      {
        //newOp.Pt = e.Top;
        newOp.Pt.X = e.Top.X;
        newOp.Pt.Y = e.Top.Y;
        newOp.Pt.Z = e.Top.Z;

ClipperLib.Clipper.prototype.SwapPoints = function (pt1, pt2)

  pt1.Value.X = pt2.Value.X;

  pt2.Value.X = tmp.X;

};
ClipperLib.Clipper.prototype.HorzSegmentsOverlap = function (Pt1a, Pt1b, Pt2a, Pt2b)
{
  //precondition: both segments are horizontal
  if ((Pt1a.X > Pt2a.X) == (Pt1a.X < Pt2b.X))
    return true;
  else if ((Pt1b.X > Pt2a.X) == (Pt1b.X < Pt2b.X))
    return true;
  else if ((Pt2a.X > Pt1a.X) == (Pt2a.X < Pt1b.X))
    return true;
  else if ((Pt2b.X > Pt1a.X) == (Pt2b.X < Pt1b.X))
    return true;
  else if ((Pt1a.X == Pt2a.X) && (Pt1b.X == Pt2b.X))
    return true;
  else if ((Pt1a.X == Pt2b.X) && (Pt1b.X == Pt2a.X))
    return true;
  else
    return false;

ClipperLib.Clipper.prototype.InsertPolyPtBetween = function (p1, p2, pt)
{
  var result = new ClipperLib.OutPt();
  //result.Pt = pt;
  result.Pt.X = pt.X;
  result.Pt.Y = pt.Y;
  if (p2 == p1.Next)
  {
    p1.Next = result;
    p2.Prev = result;
    result.Next = p2;
    result.Prev = p1;
  }
  else
  {
    p2.Next = result;
    p1.Prev = result;
    result.Next = p1;
    result.Prev = p2;
  }
  return result;
};
ClipperLib.Clipper.prototype.SetHoleState = function (e, outRec)
{

  {
    if (e2.OutIdx >= 0 && e2.WindDelta != 0)
    {

      if (outRec.FirstLeft === null)
        outRec.FirstLeft = this.m_PolyOuts[e2.OutIdx];
    }

  }

    outRec.IsHole = true;

ClipperLib.Clipper.prototype.GetDx = function (pt1, pt2)
{

ClipperLib.Clipper.prototype.FirstIsBottomPt = function (btmPt1, btmPt2)

  var p = btmPt1.Prev;
  while ((ClipperLib.IntPoint.op_Equality(p.Pt, btmPt1.Pt)) && (p != btmPt1))
    p = p.Prev;
  var dx1p = Math.abs(this.GetDx(btmPt1.Pt, p.Pt));
  p = btmPt1.Next;
  while ((ClipperLib.IntPoint.op_Equality(p.Pt, btmPt1.Pt)) && (p != btmPt1))
    p = p.Next;
  var dx1n = Math.abs(this.GetDx(btmPt1.Pt, p.Pt));
  p = btmPt2.Prev;
  while ((ClipperLib.IntPoint.op_Equality(p.Pt, btmPt2.Pt)) && (p != btmPt2))
    p = p.Prev;
  var dx2p = Math.abs(this.GetDx(btmPt2.Pt, p.Pt));
  p = btmPt2.Next;
  while ((ClipperLib.IntPoint.op_Equality(p.Pt, btmPt2.Pt)) && (p != btmPt2))
    p = p.Next;
  var dx2n = Math.abs(this.GetDx(btmPt2.Pt, p.Pt));

ClipperLib.Clipper.prototype.GetBottomPt = function (pp)
{
  var dups = null;

  while (p != pp)
  {
    if (p.Pt.Y > pp.Pt.Y)
    {
      pp = p;
      dups = null;
    }
    else if (p.Pt.Y == pp.Pt.Y && p.Pt.X <= pp.Pt.X)
    {
      if (p.Pt.X < pp.Pt.X)
      {
        dups = null;
        pp = p;
      }
      else
      {
        if (p.Next != pp && p.Prev != pp)
          dups = p;
      }
    }
    p = p.Next;
  }
  if (dups !== null)
  {
    //there appears to be at least 2 vertices at bottomPt so ...
    while (dups != p)
    {
      if (!this.FirstIsBottomPt(p, dups))
        pp = dups;
      dups = dups.Next;

    }

ClipperLib.Clipper.prototype.GetLowermostRec = function (outRec1, outRec2)

  if (outRec2.BottomPt === null)
    outRec2.BottomPt = this.GetBottomPt(outRec2.Pts);
  var bPt1 = outRec1.BottomPt;
  var bPt2 = outRec2.BottomPt;
  if (bPt1.Pt.Y > bPt2.Pt.Y)
    return outRec1;
  else if (bPt1.Pt.Y < bPt2.Pt.Y)
    return outRec2;
  else if (bPt1.Pt.X < bPt2.Pt.X)
    return outRec1;
  else if (bPt1.Pt.X > bPt2.Pt.X)
    return outRec2;
  else if (bPt1.Next == bPt1)
    return outRec2;
  else if (bPt2.Next == bPt2)
    return outRec1;
  else if (this.FirstIsBottomPt(bPt1, bPt2))

ClipperLib.Clipper.prototype.Param1RightOfParam2 = function (outRec1, outRec2)

ClipperLib.Clipper.prototype.GetOutRec = function (idx)
{

ClipperLib.Clipper.prototype.AppendPolygon = function (e1, e2)

      p1_lft.Prev = p2_lft;

      p2_lft.Prev = p1_rt;

  return a < 0 ? Math.ceil(a - 0.5) : Math.round(a)
};

  return a < 0 ? Math.ceil(a - 0.5) : Math.floor(a + 0.5)

ClipperLib.Clipper.GetBounds = function (paths)
{
  var i = 0,
    cnt = paths.length;
  while (i < cnt && paths[i].length == 0) i++;
  if (i == cnt) return new ClipperLib.IntRect(0, 0, 0, 0);
  var result = new ClipperLib.IntRect();
  result.left = paths[i][0].X;
  result.right = result.left;
  result.top = paths[i][0].Y;
  result.bottom = result.top;
  for (; i < cnt; i++)
    for (var j = 0, jlen = paths[i].length; j < jlen; j++)
    {
      if (paths[i][j].X < result.left) result.left = paths[i][j].X;
      else if (paths[i][j].X > result.right) result.right = paths[i][j].X;
      if (paths[i][j].Y < result.top) result.top = paths[i][j].Y;
      else if (paths[i][j].Y > result.bottom) result.bottom = paths[i][j].Y;
    }
  return result;
}
ClipperLib.Clipper.prototype.GetBounds2 = function (ops)
{
  var opStart = ops;
  var result = new ClipperLib.IntRect();
  result.left = ops.Pt.X;
  result.right = ops.Pt.X;
  result.top = ops.Pt.Y;
  result.bottom = ops.Pt.Y;
  ops = ops.Next;
  while (ops != opStart)
  {
    if (ops.Pt.X < result.left)
      result.left = ops.Pt.X;
    if (ops.Pt.X > result.right)
      result.right = ops.Pt.X;
    if (ops.Pt.Y < result.top)
      result.top = ops.Pt.Y;
    if (ops.Pt.Y > result.bottom)
      result.bottom = ops.Pt.Y;
    ops = ops.Next;
  }
  return result;
};

ClipperLib.Clipper.PointInPolygon = function (pt, path)
{
  //returns 0 if false, +1 if true, -1 if pt ON polygon boundary
  //http://citeseerx.ist.psu.edu/viewdoc/download?doi=10.1.1.88.5498&rep=rep1&type=pdf
  var result = 0,
    cnt = path.length;
  if (cnt < 3)
    return 0;
  var ip = path[0];
  for (var i = 1; i <= cnt; ++i)
  {
    var ipNext = (i == cnt ? path[0] : path[i]);

    {
      if ((ipNext.X == pt.X) || (ip.Y == pt.Y && ((ipNext.X > pt.X) == (ip.X < pt.X))))
        return -1;
    }
    if ((ip.Y < pt.Y) != (ipNext.Y < pt.Y))
    {
      if (ip.X >= pt.X)
      {
        if (ipNext.X > pt.X)
          result = 1 - result;
        else
        {
          var d = (ip.X - pt.X) * (ipNext.Y - pt.Y) - (ipNext.X - pt.X) * (ip.Y - pt.Y);
          if (d == 0)
            return -1;
          else if ((d > 0) == (ipNext.Y > ip.Y))
            result = 1 - result;
        }
      }
      else
      {
        if (ipNext.X > pt.X)
        {
          var d = (ip.X - pt.X) * (ipNext.Y - pt.Y) - (ipNext.X - pt.X) * (ip.Y - pt.Y);
          if (d == 0)
            return -1;
          else if ((d > 0) == (ipNext.Y > ip.Y))
            result = 1 - result;
        }
      }
    }
    ip = ipNext;
  }
  return result;
};

ClipperLib.Clipper.Area = function (poly)
{

  {

    j = i;
  }

};

  }

function dist2seg(p,a,b){const vx=b[0]-a[0],vy=b[1]-a[1],wx=p[0]-a[0],wy=p[1]-a[1];

function resampleRing(ring,spacing){if(!ring||ring.length<2)return ring?ring.slice():[];
  let pts=ring.slice();if(pts.length>1&&pts[0][0]===pts[pts.length-1][0]&&pts[0][1]===pts[pts.length-1][1])pts.pop();
  const n=pts.length;if(n<2)return pts;const cum=[0];let total=0;

  let d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);}
  return d+' Z';}
function bbox(){let a=[1e9,1e9,-1e9,-1e9];
  for(const d of DATA.districts)for(const p of d.pts){a[0]=Math.min(a[0],p[0]);a[1]=Math.min(a[1],p[1]);a[2]=Math.max(a[2],p[0]);a[3]=Math.max(a[3],p[1]);}
  if(DATA.volga)for(const vl of DATA.volga)for(const p of vl){a[0]=Math.min(a[0],p[0]);a[1]=Math.min(a[1],p[1]);a[2]=Math.max(a[2],p[0]);a[3]=Math.max(a[3],p[1]);}
  return a;}
const bb=bbox();
svg.setAttribute('viewBox',`${bb[0]-30} ${bb[1]-30} ${bb[2]-bb[0]+60} ${bb[3]-bb[1]+60}`);
svg.setAttribute('width','100%');svg.setAttribute('height','100vh');

function render(){
  const r0=+document.getElementById('sR0').value;
  const r=+document.getElementById('sR').value;
  const ten=+document.getElementById('sT').value;
  const showDetect=document.getElementById('cbDetect').checked;
  const showShrink=document.getElementById('cbShrink').checked;
  const showMarker=document.getElementById('cbMarker').checked;
  const showBase=document.getElementById('cbBase').checked;
  document.getElementById('vR0').textContent=r0;
  document.getElementById('vR').textContent=r;
  document.getElementById('vT').textContent=ten;
  let s='';
  if(showBase){
    for(const d of DATA.districts) s+=`<path d="${fmt(d.pts)}" fill="#4a5163" stroke="#9aa3b2" stroke-width="0.8"/>`;
    if(DATA.volga) for(const vl of DATA.volga) s+=`<path d="${fmt(vl)}" fill="#1d3a5a" stroke="#39f" stroke-width="1"/>`;
  }
  if(showDetect){
    for(const d of DATA.districts){
      const ring=resampleRing(d.pts,3);const thin=detectThin(d.pts,r0);
      for(let i=0;i<ring.length;i++){if(thin[i]){const a=ring[i],b=ring[(i+1)%ring.length];
        s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#f33" stroke-width="2.4"/>`;}}
    }
  }
  if(showShrink){
    for(const d of DATA.districts){const sh=shrinkRing(d.pts,r,{finalSmooth:ten});
      if(sh.length) s+=`<path d="${fmtC(sh)}" fill="none" stroke="#f90" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>`;}
  }
  if(showMarker && DATA.marker){
    s+=`<path d="${fmt(DATA.marker)}" fill="none" stroke="#f0f" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  svg.innerHTML=s;
}
['sR0','sR','sT','cbDetect','cbShrink','cbMarker','cbBase'].forEach(id=>
  document.getElementById(id).addEventListener('input',render));
render();
</script>
